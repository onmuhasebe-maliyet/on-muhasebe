name: TCMB kurlarını güncelle

on:
  schedule:
    # Hafta içi her gün 16:00 ve 17:30 (Türkiye saati) - TCMB kurları 15:30'da ilan edilir
    - cron: "0 13 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch:
    inputs:
      baslangic:
        description: "Geçmişe dönük doldurma başlangıç tarihi (YYYY-AA-GG, boş bırakılabilir)"
        required: false

permissions:
  contents: write

concurrency:
  group: kurlar
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Kurları indir
        run: |
          if [ -n "${{ github.event.inputs.baslangic }}" ]; then
            python scripts/kur_guncelle.py --baslangic "${{ github.event.inputs.baslangic }}"
          else
            python scripts/kur_guncelle.py
          fi
      - name: Değişiklik varsa kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add kurlar.json
          if git diff --staged --quiet; then
            echo "Yeni kur yok."
          else
            git commit -m "TCMB döviz satış kurları güncellendi"
            git push
          fi
